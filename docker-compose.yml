version: "3.8"

services:
  backend:
    build: ./backend
    container_name: twin_backend_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TB_HOST=thingsboard.cloud
      - TB_PORT=1883
      - TB_TOKEN=XiP9UJASXyIQd3aBzzfr
    networks:
      - twin_net

  frontend:
    build: ./frontend
    container_name: twin_3d_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - twin_net

networks:
  twin_net:
    driver: bridge
